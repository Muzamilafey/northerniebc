# /etc/nginx/sites-available/northern-iebc — TLS via certbot (Let's Encrypt).
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

upstream nie_api {
    least_conn;
    server 127.0.0.1:4000;
    # server 127.0.0.1:4001;   # additional PM2 instances
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.org www.example.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.org www.example.org;

    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.paystack.com https://www.paypal.com" always;

    client_max_body_size 12m;
    server_tokens off;

    root /srv/northern-iebc/web/dist;
    index index.html;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://nie_api;
        include /etc/nginx/snippets/nie-proxy.conf;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://nie_api;
        include /etc/nginx/snippets/nie-proxy.conf;
    }
    location /socket.io/ {
        proxy_pass http://nie_api;
        include /etc/nginx/snippets/nie-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location = /healthz { proxy_pass http://nie_api; access_log off; }

    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
