name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Transactions need a replica set; host networking keeps the advertised member address reachable.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name rs --network host mongo:7.0 --replSet rs0 --bind_ip 127.0.0.1
          for i in $(seq 1 30); do docker exec rs mongosh --quiet --eval 'try{rs.status().ok}catch(e){rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})}' && break; sleep 2; done
      - run: npm ci
      - run: npm run typecheck
      - name: Server tests
        run: npm test -w server
      - run: npm test -w web
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high || true
